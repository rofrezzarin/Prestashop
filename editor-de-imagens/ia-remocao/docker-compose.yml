services:
  rembg:
    image: danielgatis/rembg:latest
    command: ["s", "--host", "0.0.0.0", "--port", "7000", "--no-ui"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:7000:7000"
    environment:
      OMP_NUM_THREADS: "4"
      REMBG_HOME: /root/.rembg
    volumes:
      - rembg_models:/root/.rembg

volumes:
  rembg_models:

